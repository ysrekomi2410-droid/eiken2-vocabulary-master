<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="英検2級合格のための英単語・熟語・句動詞学習ツール">
<title>英検2級 Vocabulary &amp; Idiom Master</title>
<style>
/* 英検2級 Vocabulary & Idiom Master — シンプルで読みやすいデザイン */
:root {
  --bg: #f4f5f7;
  --card: #ffffff;
  --ink: #1d2330;
  --ink2: #5b6475;
  --ink3: #8a92a3;
  --line: #e3e6eb;
  --soft: #eef0f4;
  --accent: #2f5bd3;
  --accent-soft: #e8eefc;
  --good: #1f9d63;
  --good-soft: #e5f5ed;
  --bad: #d64545;
  --bad-soft: #fcebeb;
  --learn: #4b7be5;
  --new: #cfd4dc;
  --soft2: var(--soft2);
  --hover: var(--hover);
  --focus: var(--focus);
  --bar-bg: var(--bar-bg);
  --key-bg: var(--key-bg);
  --star: var(--star);
  --star-off: var(--star-off);
  --bad-line: var(--bad-line);
  --good-line: var(--good-line);
  --head-bg: rgba(255,255,255,.92);
  --on-accent: #ffffff;
  --accent-dark: var(--accent-dark);
  --shadow: var(--shadow);
  --radius: 14px;
  --font: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
  --en: "Inter", "Segoe UI", "Helvetica Neue", Arial, var(--font);
  color-scheme: light;
}
/* ダークモード（端末の設定に合わせる） */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --card: #1b1f27; --ink: #e8ebf1; --ink2: #aab2c0; --ink3: #7d8697;
    --line: #2c323d; --soft: #252a34; --accent: #7d9df0; --accent-soft: #232d47;
    --good: #43c08a; --good-soft: #17322a; --bad: #f07a7a; --bad-soft: #3a1f22;
    --learn: #6f95ee; --new: #3a404c; --soft2: #20252e; --hover: #222a3a; --focus: #5f7fd6;
    --bar-bg: #2a3350; --key-bg: #2e2a1c; --star: #f0b72f; --star-off: #3a404c;
    --bad-line: #6b3236; --good-line: #2a5a45; --head-bg: rgba(27,31,39,.92);
    --on-accent: #0f1320; --accent-dark: #9bb4f5; --shadow: rgba(0,0,0,.4); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --card: #1b1f27; --ink: #e8ebf1; --ink2: #aab2c0; --ink3: #7d8697;
  --line: #2c323d; --soft: #252a34; --accent: #7d9df0; --accent-soft: #232d47;
  --good: #43c08a; --good-soft: #17322a; --bad: #f07a7a; --bad-soft: #3a1f22;
  --learn: #6f95ee; --new: #3a404c; --soft2: #20252e; --hover: #222a3a; --focus: #5f7fd6;
  --bar-bg: #2a3350; --key-bg: #2e2a1c; --star: #f0b72f; --star-off: #3a404c;
  --bad-line: #6b3236; --good-line: #2a5a45; --head-bg: rgba(27,31,39,.92);
  --on-accent: #0f1320; --accent-dark: #9bb4f5; --shadow: rgba(0,0,0,.4); color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font); font-size: 16px; line-height: 1.6;
  padding-bottom: calc(68px + env(safe-area-inset-bottom));
}
a { color: var(--accent); text-decoration: none; }
h1 { font-size: 1.3rem; margin: 0 0 12px; }
h2 { font-size: 1.05rem; margin: 0 0 12px; }
h2 small, h1 small { font-weight: normal; color: var(--ink3); font-size: .8rem; margin-left: 6px; }
h3 { font-size: .85rem; color: var(--ink2); margin: 18px 0 8px; font-weight: 600; }
code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .92em; }
.hidden { display: none !important; }

/* ヘッダー・タブバー */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head-bg);
  backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
}
.brand { color: var(--ink); font-weight: 700; font-size: 1rem; }
.brand span { color: var(--ink3); font-weight: 500; font-size: .8rem; margin-left: 4px; }
.gear { color: var(--ink2); display: flex; padding: 4px; }
main { max-width: 760px; margin: 0 auto; padding: 16px; }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  display: flex; background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tabbar a {
  flex: 1; text-align: center; padding: 8px 0 7px; color: var(--ink3); font-size: .72rem;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.tabbar a svg { width: 22px; height: 22px; }
.tabbar a.on { color: var(--accent); font-weight: 600; }
@media (min-width: 900px) {
  body { padding-bottom: 0; }
  .tabbar { position: sticky; top: 49px; bottom: auto; justify-content: center; border-top: 0; border-bottom: 1px solid var(--line); }
  .tabbar a { flex: 0 0 auto; flex-direction: row; gap: 6px; padding: 10px 18px; font-size: .88rem; }
  .tabbar a svg { width: 18px; height: 18px; }
}

/* カード・ボタン */
.card { background: var(--card); border-radius: var(--radius); padding: 18px; margin-bottom: 14px; border: 1px solid var(--line); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px;
  padding: 10px 16px; font: inherit; font-size: .92rem; cursor: pointer; min-height: 44px;
}
.btn:hover { background: var(--soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { padding: 6px 12px; font-size: .84rem; min-height: 36px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink2); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn.primary:hover { background: var(--accent-dark); }
.btn.good { background: var(--good); border-color: var(--good); color: var(--on-accent); }
.btn.bad { color: var(--bad); border-color: var(--bad-line); }
.btn.bad.big { background: var(--bad); color: var(--on-accent); border-color: var(--bad); }
.btn.big { width: 100%; padding: 14px 16px; font-size: 1rem; font-weight: 600; flex-direction: column; gap: 0; }
.btn.big small { font-weight: normal; opacity: .8; font-size: .75rem; }
.btn:focus-visible, .opt:focus-visible, .chip:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.ract { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.lead { color: var(--ink2); font-size: .9rem; margin: 0 0 12px; }
.sub { color: var(--ink3); font-size: .82rem; }
.empty { color: var(--ink3); text-align: center; padding: 24px 0; }

/* ホーム */
.hero-head { display: flex; justify-content: space-between; align-items: baseline; }
.streak { font-size: .85rem; color: var(--ink2); }
.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0 16px; }
.kpis.six { grid-template-columns: repeat(3, 1fr); }
@media (min-width: 600px) { .kpis.six { grid-template-columns: repeat(6, 1fr); } }
.kpi { background: var(--soft); border-radius: 10px; padding: 10px 6px; text-align: center; }
.kpi b { display: block; font-size: 1.3rem; line-height: 1.2; font-family: var(--en); }
.kpi span { font-size: .7rem; color: var(--ink2); }
.pbar { display: flex; height: 10px; border-radius: 6px; background: var(--new); overflow: hidden; }
.pbar .seg.master { background: var(--good); }
.pbar .seg.learning { background: var(--learn); }
.pbar .seg.weak { background: var(--bad); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .78rem; color: var(--ink2); margin-top: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 4px; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--new); flex: 0 0 9px; }
.dot.master { background: var(--good); } .dot.learning { background: var(--learn); } .dot.weak { background: var(--bad); }
.chart { display: flex; gap: 6px; height: 110px; align-items: stretch; }
.chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; }
.chart .bars { flex: 1; width: 100%; max-width: 34px; display: flex; align-items: flex-end; }
.chart .b { width: 100%; background: var(--bar-bg); border-radius: 4px 4px 0 0; display: flex; align-items: flex-end; min-height: 2px; }
.chart .bc { width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
.chart small { font-size: .68rem; color: var(--ink2); height: 16px; }
.chart em { font-style: normal; font-size: .72rem; color: var(--ink3); }
.sec { margin: 22px 2px 10px; }
.modes { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 14px; }
@media (min-width: 600px) { .modes { grid-template-columns: repeat(3, 1fr); } }
.mode { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; color: var(--ink); display: flex; flex-direction: column; gap: 2px; }
.mode:hover { border-color: var(--accent); }
.mode .mn { font-size: .7rem; color: var(--accent); font-weight: 700; }
.mode small { color: var(--ink3); font-size: .75rem; line-height: 1.4; }
.catrow { display: grid; grid-template-columns: 8.5em 1fr 4.5em; align-items: center; gap: 10px; padding: 7px 0; color: var(--ink); font-size: .86rem; border-top: 1px solid var(--soft); }
.catrow:first-of-type { border-top: 0; }
.catrow .cn { text-align: right; color: var(--ink3); font-size: .78rem; font-family: var(--en); }

/* 単語帳一覧 */
.toolbar { padding: 12px; position: sticky; top: 49px; z-index: 5; }
@media (min-width: 900px) { .toolbar { top: 92px; } }
input[type=search], input[type=text], select {
  font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; background: var(--card); color: var(--ink); width: 100%;
}
input:focus, select:focus { outline: 2px solid var(--focus); border-color: transparent; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 0 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 5px 12px; font: inherit; font-size: .82rem; color: var(--ink2); cursor: pointer; }
.chip.on { background: var(--ink); color: var(--on-accent); border-color: var(--ink); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.filters select { width: auto; flex: 1 1 120px; padding: 6px 8px; font-size: .84rem; }
.seg-ctl { display: inline-flex; background: var(--soft); border-radius: 10px; padding: 3px; flex: 1 1 200px; }
.seg-ctl button { flex: 1; border: 0; background: transparent; font: inherit; font-size: .8rem; padding: 6px 8px; border-radius: 8px; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.seg-ctl button.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px var(--shadow); }
.seg-ctl.wide { display: flex; margin-bottom: 4px; }
.listhead { display: flex; justify-content: space-between; align-items: center; margin: 4px 2px 8px; font-size: .85rem; color: var(--ink2); }
.listhead .acts { display: flex; gap: 6px; }
.rows { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.card .rows { border: 0; border-radius: 0; }
.row { display: grid; grid-template-columns: 12px minmax(0, auto) auto 1fr auto; align-items: center; gap: 4px 10px; padding: 11px 14px; border-top: 1px solid var(--soft); color: var(--ink); }
.row:first-child { border-top: 0; }
.row:hover { background: var(--soft2); }
.rw { font-family: var(--en); font-weight: 600; font-size: 1.02rem; }
.rp { font-size: .7rem; color: var(--ink3); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.rj { color: var(--ink2); font-size: .88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.rl { font-size: .7rem; }
.rpat { grid-column: 2 / -1; font-size: .78rem; color: var(--ink3); font-family: var(--en); }
@media (max-width: 560px) {
  .row { grid-template-columns: 12px 1fr auto; }
  .row .rp { display: none; }
  .row .rj { grid-column: 2 / 4; white-space: normal; }
  .row .rl { grid-row: 1; grid-column: 3; }
}
.view-en .rj { color: transparent; background: var(--soft); border-radius: 4px; }
.view-ja .rw { color: transparent; background: var(--soft); border-radius: 4px; }
.view-ja .rw::selection, .view-en .rj::selection { color: transparent; }
.more { width: 100%; border: 0; border-top: 1px solid var(--soft); border-radius: 0; color: var(--accent); }
.stars { color: var(--star); letter-spacing: -1px; font-size: .78rem; white-space: nowrap; }
.stars i { color: var(--star-off); font-style: normal; }

/* 単語詳細 */
.wnav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; color: var(--ink3); font-size: .85rem; }
.wnav .pn { display: flex; gap: 6px; }
.w-head { display: flex; align-items: center; gap: 10px; }
.w-word { font-family: var(--en); font-size: 2.2rem; margin: 0; line-height: 1.2; word-break: break-word; }
.w-pron { color: var(--ink2); margin: 4px 0 10px; display: flex; gap: 12px; flex-wrap: wrap; }
.ipa { font-family: "Lucida Sans Unicode", "Arial Unicode MS", "Segoe UI", var(--en); color: var(--ink2); }
.kana { color: var(--ink3); font-size: .9rem; }
.w-tags { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tag { font-size: .72rem; background: var(--soft); color: var(--ink2); border-radius: 6px; padding: 2px 8px; }
.tag.pos { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.tag.st-weak { background: var(--bad-soft); color: var(--bad); }
.tag.st-master { background: var(--good-soft); color: var(--good); }
.w-ja { font-size: 1.25rem; font-weight: 600; margin: 14px 0 8px; }
.w-key, .w-pat { background: var(--key-bg); border-radius: 10px; padding: 10px 12px; font-size: .9rem; margin: 8px 0; }
.w-pat { background: var(--accent-soft); }
.w-key b, .w-pat b { display: block; font-size: .72rem; color: var(--ink2); }
.w-pat code { font-size: 1rem; color: var(--ink); }
.sec-b { border-top: 1px solid var(--soft); margin-top: 14px; }
.sec-b p { margin: 0; font-size: .92rem; }
.exs { list-style: none; padding: 0; margin: 0; }
.exs li { margin-bottom: 10px; }
.en { font-family: var(--en); font-size: 1rem; margin: 0 0 2px; line-height: 1.55; }
.jp { color: var(--ink2); font-size: .86rem; margin: 0; }
.hl { color: var(--accent); }
.lines { margin: 0; padding-left: 1.1em; font-size: .9rem; }
.lines li { margin: 2px 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tags span { background: var(--soft); border-radius: 6px; padding: 3px 10px; font-size: .86rem; }
.speak { border: 0; background: var(--soft); color: var(--ink2); width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; vertical-align: middle; padding: 0; flex: 0 0 auto; }
.speak:hover { background: var(--accent-soft); color: var(--accent); }
.speak.lg { width: 40px; height: 40px; }
.stats .btn { margin-top: 4px; }

/* テスト */
.modepick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-bottom: 14px; }
@media (min-width: 600px) { .modepick { grid-template-columns: repeat(3, 1fr); } }
.mp { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; display: flex; flex-direction: column; }
.mp input { position: absolute; opacity: 0; pointer-events: none; }
.mp small { color: var(--ink3); font-size: .74rem; line-height: 1.4; }
.mp.on { border-color: var(--accent); background: var(--accent-soft); }
.form { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 600px) { .form { grid-template-columns: 1fr 1fr; } }
.form label { font-size: .8rem; color: var(--ink2); display: flex; flex-direction: column; gap: 4px; }
.pool { font-size: .86rem; color: var(--ink2); margin: 14px 0 10px; }
.qhead { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: .85rem; color: var(--ink2); font-family: var(--en); }
.qhead .ok { color: var(--good); }
.qprog { flex: 1; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.qprog span { display: block; height: 100%; background: var(--accent); }
.qtype { font-size: .75rem; color: var(--ink3); margin: 0 2px 6px; }
.quiz { text-align: center; padding: 26px 18px; }
.qword { font-family: var(--en); font-size: 2.3rem; font-weight: 700; line-height: 1.25; display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; word-break: break-word; }
.qword.prep { font-size: 1.8rem; margin: 10px 0; }
.qja { font-size: 1.4rem; font-weight: 700; line-height: 1.45; }
.qja2 { font-size: 1.3rem; font-weight: 700; margin: 4px 0 10px; }
.qsub { color: var(--ink3); font-size: .9rem; margin: 6px 0 18px; }
.reveal { border-top: 1px dashed var(--line); padding-top: 14px; margin: 4px 0 16px; }
.qact { margin-top: 10px; }
.qact.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: grid; grid-template-columns: 1fr; gap: 8px; text-align: left; margin-top: 8px; }
.opts.four { grid-template-columns: 1fr 1fr; }
@media (min-width: 600px) { .opts { grid-template-columns: 1fr 1fr; } }
.opt { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 13px 14px; cursor: pointer; display: flex; gap: 10px; align-items: center; color: var(--ink); min-height: 54px; font-size: .98rem; }
.opt:hover:not(:disabled) { border-color: var(--accent); background: var(--hover); }
.opt .on { flex: 0 0 22px; height: 22px; border-radius: 6px; background: var(--soft); color: var(--ink3); font-size: .75rem; display: flex; align-items: center; justify-content: center; font-family: var(--en); }
.opt:disabled { cursor: default; color: var(--ink2); }
.opt.correct { border-color: var(--good); background: var(--good-soft); color: var(--ink); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opts.four .opt { font-family: var(--en); font-size: 1.1rem; justify-content: flex-start; }
.blank { display: inline-block; min-width: 4.5em; border-bottom: 2px solid var(--accent); margin: 0 2px; color: var(--accent); text-align: center; }
.blank.sm { min-width: 2.2em; }
.fill-en { font-family: var(--en); font-size: 1.25rem; line-height: 1.7; text-align: left; margin: 0 0 10px; }
.hintbox { text-align: left; font-size: .85rem; color: var(--ink2); margin-bottom: 8px; }
.hintbox summary { cursor: pointer; color: var(--accent); }
.hint { font-size: .85rem; color: var(--ink3); margin: 4px 0 12px; }
.jform { display: flex; gap: 8px; margin: 10px 0 8px; }
.jform input { font-family: var(--en); font-size: 1.1rem; }
.fb { text-align: left; border-width: 2px; }
.fb.good { border-color: var(--good-line); }
.fb.bad { border-color: var(--bad-line); }
.fb-h { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
.fb.good .fb-h { color: var(--good); }
.fb.bad .fb-h { color: var(--bad); }
.fb-w { font-family: var(--en); font-size: 1.3rem; font-weight: 700; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fb-w a { color: var(--ink); }
.fb-w .ipa { font-weight: normal; font-size: .9rem; }
.fb-ja { font-weight: 600; margin-bottom: 8px; }
.fb-pat code { background: var(--accent-soft); padding: 2px 8px; border-radius: 6px; }
.fb .en { margin-top: 8px; }
.fb-tip { font-size: .85rem; color: var(--ink2); background: var(--soft); border-radius: 8px; padding: 8px 10px; margin: 10px 0; }
.fb-weak { font-size: .8rem; color: var(--bad); margin: 6px 0; }
.other, .yours { font-size: .88rem; color: var(--ink2); margin: 4px 0 8px; }
.fb .btn.big { margin-top: 12px; }
.result { text-align: center; }
.score { font-family: var(--en); font-size: 1.2rem; color: var(--ink2); margin: 6px 0 18px; }
.score b { font-size: 3rem; color: var(--ink); }
.score span { display: block; font-size: .95rem; }
.perfect { color: var(--good); font-weight: 600; }
.result .ract { justify-content: center; }
.mark { font-weight: 700; }
.mark.good { color: var(--good); } .mark.bad { color: var(--bad); }

/* 熟語集中 */
.drills { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
@media (min-width: 600px) { .drills { grid-template-columns: repeat(3, 1fr); } }
.drill { font: inherit; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 12px; cursor: pointer; display: flex; flex-direction: column; color: var(--ink); }
.drill:hover { border-color: var(--accent); background: var(--hover); }
.drill small { color: var(--ink3); font-size: .74rem; }
.idl .row { grid-template-columns: 12px auto 1fr; }

/* 苦手・記録 */
.rec { width: 100%; border-collapse: collapse; font-size: .86rem; }
.rec th { text-align: left; font-size: .72rem; color: var(--ink3); font-weight: 600; padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.rec td { padding: 9px 6px; border-bottom: 1px solid var(--soft); font-family: var(--en); white-space: nowrap; }
.rec td:first-child { white-space: normal; }
.rec td a { color: var(--ink); display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; }
.rec td a small { color: var(--ink3); font-family: var(--font); }
.rec td.bad { color: var(--bad); font-weight: 600; }
@media (max-width: 560px) {
  .rec thead { display: none; }
  .rec tr { display: flex; flex-wrap: wrap; gap: 2px 12px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  .rec td { border: 0; padding: 0; font-size: .78rem; color: var(--ink2); }
  .rec td:first-child { width: 100%; font-size: .95rem; margin-bottom: 2px; }
  .rec td[data-l]::before { content: attr(data-l) " "; color: var(--ink3); font-family: var(--font); }
}

/* 設定 */
.sw { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; }
.rng { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.src { font-size: .82rem; color: var(--ink2); padding-left: 1.2em; columns: 2; }

/* お知らせ・確認ダイアログ */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 50;
  bottom: calc(80px + env(safe-area-inset-bottom, 0px));
  background: var(--ink); color: var(--bg); padding: 10px 18px; border-radius: 10px; font-size: .9rem;
  max-width: calc(100% - 32px); box-shadow: 0 4px 16px var(--shadow);
}
.modal { position: fixed; inset: 0; z-index: 40; background: rgba(10,14,22,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal-box { background: var(--card); color: var(--ink); border-radius: var(--radius); padding: 20px; max-width: 420px; width: 100%; border: 1px solid var(--line); }
.modal-box p { margin: 0 0 4px; }
.modal-box .ract { justify-content: flex-end; }
.btn.bad.big1 { background: var(--bad); color: var(--on-accent); border-color: var(--bad); }
.backup textarea { width: 100%; font: .78rem/1.4 ui-monospace, Menlo, Consolas, monospace; border: 1px solid var(--line); border-radius: 10px; padding: 8px; background: var(--soft2); color: var(--ink); resize: vertical; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }

{ w:"out of order", k:"id", ja:"故障して", pat:"be out of order", lv:2,
  ex:[["The elevator is {out of order}, so please use the stairs.","エレベーターが故障中なので階段をご利用ください。"]],
  syn:["broken","not working"], tip:"掲示やアナウンスで頻出。",
  note:"公共の機械に使う。", cat:["life"] },
{ w:"up to date", k:"id", ja:"最新の", pat:"be up to date / up-to-date 名詞", lv:2,

  ant:["out of date"], rel:["update (v) 更新する"], tip:"名詞の前ではハイフンを付ける（up-to-date information）。",
  note:"反対は out of date（時代遅れの）。", cat:["sci"] },
{ w:"by the time", k:"id", ja:"〜するまでには", pat:"by the time S V", lv:2,

  tip:"until（〜までずっと）と by（〜までに）の違いがそのまま当てはまる。",
  note:"未来のことでも節内は現在形。", cat:["life"] },
{ w:"in return", k:"id", ja:"お返しに、見返りに", pat:"in return (for A)", lv:2,

  tip:"in return for A（Aのお返しに）。",
  note:"冠詞は付けない。", cat:["human"] },
{ w:"little by little", k:"id", ja:"少しずつ", pat:"little by little", lv:2,
  ex:[["My English is improving {little by little}.","私の英語は少しずつ上達している。"]],
  syn:["gradually","step by step"], tip:"step by step（一歩ずつ）も同様の表現。",
  note:"副詞として文末に置くことが多い。", cat:["edu"] },
{ w:"one after another", k:"id", ja:"次々に", pat:"one after another", lv:2,
  ex:[["New stores opened {one after another} near the station.","駅の近くに新しい店が次々にオープンした。"]],
  syn:["one by one"], tip:"one by one は「1つずつ」。",
  note:"副詞として使う。", cat:["life"] },
{ w:"for the sake of", k:"id", ja:"〜のために", pat:"for the sake of A", lv:2,
  ex:[["He moved to the countryside {for the sake of} his health.","彼は健康のために田舎へ引っ越した。"]],
  syn:["for the benefit of"], tip:"for A's sake（Aのために）の形もある。",
  note:"後ろは名詞。", cat:["med"] },
{ w:"with the help of", k:"id", ja:"〜の助けを借りて", pat:"with the help of A", lv:2,
  ex:[["{With the help of} AI, doctors can find diseases earlier.","AIの助けを借りて、医師は病気をより早く発見できる。"]],
  tip:"with A's help の形もある。",
  note:"後ろは名詞。", cat:["sci","med"] },
{ w:"had better", k:"id", ja:"〜した方がよい（しないとまずい）", pat:"had better do / had better not do", lv:2,
  ex:[["You {had better} see a doctor soon.","すぐに医者に診てもらった方がいいよ。"]],
  syn:["should"], tip:"「そうしないと困ったことになる」という強い忠告。目上の人には should が無難。",
  note:"否定は had better not do。", cat:["life"] },
{ w:"would rather", k:"id", ja:"むしろ〜したい", pat:"would rather do (than do)", lv:2,
  ex:[["I {would rather} stay home than go out in this rain.","この雨の中出かけるより、家にいたい。"]],
  syn:["prefer to do"], tip:"than の後ろも動詞の原形。",
  note:"短縮形は I'd rather。", cat:["life"] },
{ w:"there is no doubt that", k:"id", ja:"〜ということは疑いない", pat:"There is no doubt that ...", lv:2,
  ex:[["{There is no doubt that} smartphones have changed our lives.","スマートフォンが私たちの生活を変えたことは疑いない。"]],
  syn:["certainly","without doubt"], tip:"ライティングの主張を強める表現として使える。",
  note:"doubt の後ろは that節。", cat:["soc"] },
{ w:"more and more", k:"id", ja:"ますます多くの、ますます", pat:"more and more A / 比較級 and 比較級", lv:3,
  ex:[["{More and more} people are working from home.","ますます多くの人が在宅勤務をしている。"]],
  syn:["an increasing number of"], tip:"an increasing number of A（ますます多くのA）は長文で頻出の言い換え。",
  note:"後ろの名詞が複数なら動詞も複数形。", cat:["soc"] },
{ w:"from now on", k:"id", ja:"今後は、これからは", pat:"from now on", lv:2,
  ex:[["{From now on}, I will walk to school every day.","これからは毎日歩いて学校に行くつもりだ。"]],
  tip:"決意を述べるときによく使う。",
  note:"文頭・文末に置く。", cat:["life"] },
{ w:"at once", k:"id", ja:"①すぐに ②同時に", pat:"at once", lv:2,
  ex:[["Please call the police {at once}.","すぐに警察に電話してください。"]],
  syn:["immediately","right away"], tip:"all at once は「突然」。",
  note:"文末に置くことが多い。", cat:["life"] },
{ w:"all of a sudden", k:"id", ja:"突然", pat:"all of a sudden", lv:2,
  ex:[["{All of a sudden}, the lights went out.","突然、明かりが消えた。"]],
  syn:["suddenly","all at once"], tip:"suddenly と同じ意味の熟語。",
  note:"文頭で使うことが多い。", cat:["life"] }
], "idioms-01");

<script>
/* 英検2級 重要句動詞 01
 * note の「分離可」＝ 目的語を動詞と副詞の間に置ける（代名詞なら必ず間に置く）
 *       「分離不可」＝ 前置詞の後ろに目的語を置く
 */
EIKEN.add([
{ w:"deal with", k:"ph", ja:"〜に対処する、〜を扱う", pat:"deal with A", lv:3,
  ex:[["The city has to {deal with} the problem of traffic jams.","市は交通渋滞の問題に対処しなければならない。"],["This book {deals with} the history of Japanese food.","この本は日本食の歴史を扱っている。"]],
  syn:["handle","cope with","tackle"], tip:"cope with は「（困難を）何とか切り抜ける」ニュアンスが強い。deal with は問題処理・話題を扱う意味まで幅広い。",
  note:"分離不可。deal with it（× deal it with）。過去形は dealt [delt]。", cat:["soc"] },
{ w:"come up with", k:"ph", ja:"（考え・案）を思いつく、考え出す", pat:"come up with A", lv:3,
  ex:[["She {came up with} a great idea for the school festival.","彼女は文化祭のためのすばらしいアイデアを思いついた。"]],
  syn:["think of","invent"], tip:"think of より「（解決策などを）ひねり出す」ニュアンス。目的語は idea, plan, solution など。",
  note:"分離不可。3語で1つの他動詞として扱う。", cat:["edu"] },
{ w:"carry out", k:"ph", ja:"〜を実行する、実施する", pat:"carry out A / carry A out", lv:3,
  ex:[["Scientists {carried out} an experiment to test the theory.","科学者たちはその理論を検証するための実験を行った。"]],
  syn:["conduct","perform","do"], tip:"目的語は experiment, survey, research, plan など。「計画・調査を実行する」で頻出。",
  note:"分離可。代名詞は carry it out の語順。", cat:["sci"] },
{ w:"put off", k:"ph", ja:"〜を延期する", pat:"put off A / put A off / put off doing", lv:3,
  ex:[["We had to {put} the meeting {off} until next week.","私たちは会議を来週まで延期しなければならなかった。"],["Don't {put off} doing your homework.","宿題をするのを先延ばしにしてはいけない。"]],
  syn:["postpone","delay"], tip:"postpone は硬い1語の同義語。call off（中止する）と混同しない。",
  note:"分離可。put it off（× put off it）。後ろに動詞を置くときは動名詞。", cat:["life"] },
{ w:"figure out", k:"ph", ja:"〜を理解する、〜を解決する、わかる", pat:"figure out A / figure A out / figure out wh-節", lv:3,
  ex:[["I couldn't {figure out} how to use the new software.","新しいソフトの使い方がわからなかった。"]],
  syn:["work out","understand","solve"], tip:"考えた末に「わかる・答えを出す」。find out は「（調べて事実を）知る」。",
  note:"分離可。figure it out。how / why などの疑問詞節を続けることが多い。", cat:["edu"] },
{ w:"account for", k:"ph", ja:"①（割合）を占める ②〜を説明する、〜の原因となる", pat:"account for A", lv:3,
  ex:[["Young people {account for} about 30 percent of the users.","若者が利用者の約30％を占めている。"],["Bad weather {accounted for} the delay.","悪天候が遅延の原因だった。"]],
  syn:["make up","explain"], tip:"グラフ・割合の説明で「〜を占める」の意味が特に頻出。",
  note:"分離不可。", cat:["eco","soc"] },
{ w:"call off", k:"ph", ja:"〜を中止する", pat:"call off A / call A off", lv:3,
  ex:[["The baseball game was {called off} because of the rain.","雨のため野球の試合は中止になった。"]],
  syn:["cancel"], tip:"put off（延期）との違いが頻出。call off ＝ cancel（中止）。",
  note:"分離可。call it off。", cat:["life"] },
{ w:"bring about", k:"ph", ja:"〜を引き起こす、もたらす", pat:"bring about A", lv:3,
  ex:[["The Internet has {brought about} great changes in our lives.","インターネットは私たちの生活に大きな変化をもたらした。"]],
  syn:["cause","lead to","result in"], tip:"目的語は change, revolution など。cause は悪い結果が多いが、bring about は良い変化にも使う。",
  note:"目的語が長いので通常 bring about A の語順。", cat:["soc","sci"] },
{ w:"bring up", k:"ph", ja:"①〜を育てる ②（話題）を持ち出す", pat:"bring up A / bring A up", lv:3,
  ex:[["She was {brought up} by her grandparents.","彼女は祖父母に育てられた。"],["He {brought up} an interesting topic at the meeting.","彼は会議で興味深い話題を持ち出した。"]],
  syn:["raise","mention"], tip:"「育てる」は raise とも言える。grow up は自動詞で「育つ」。",
  note:"分離可。受け身の be brought up（育てられる）が頻出。", cat:["human"] },
{ w:"look into", k:"ph", ja:"〜を調査する", pat:"look into A", lv:3,
  ex:[["The police are {looking into} the cause of the fire.","警察は火事の原因を調べている。"]],
  syn:["investigate","examine"], tip:"「中をのぞき込む」から「調査する」。investigate の口語的表現。",
  note:"分離不可。look into it。", cat:["soc"] },
{ w:"look up to", k:"ph", ja:"〜を尊敬する", pat:"look up to A", lv:3,
  ex:[["Many young players {look up to} him as a role model.","多くの若い選手が彼を手本として尊敬している。"]],
  syn:["respect","admire"], ant:["look down on"], tip:"反対は look down on（〜を見下す）。up / down のイメージで覚える。",
  note:"分離不可。", cat:["human"] },
{ w:"look down on", k:"ph", ja:"〜を見下す、軽蔑する", pat:"look down on A", lv:2,
  ex:[["You should not {look down on} people because of their jobs.","職業で人を見下すべきではない。"]],
  syn:["despise"], ant:["look up to"], tip:"look up to（尊敬する）と対で覚える。",
  note:"分離不可。", cat:["human"] },
{ w:"look forward to", k:"ph", ja:"〜を楽しみに待つ", pat:"look forward to A / doing", lv:3,
  ex:[["I'm {looking forward to} seeing you again.","またお会いできるのを楽しみにしています。"]],
  tip:"手紙・メールの結びの定番。I look forward to hearing from you.（お返事をお待ちしています）",
  note:"to は前置詞なので後ろは名詞か動名詞。× look forward to see", cat:["human","life"] },
{ w:"look after", k:"ph", ja:"〜の世話をする", pat:"look after A", lv:3,
  ex:[["My sister {looks after} our dog when we travel.","私たちが旅行するとき、姉が犬の世話をしてくれる。"]],
  syn:["take care of","care for"], tip:"take care of と同じ意味。care for は「〜の世話をする／〜を好む」。",
  note:"分離不可。", cat:["life","human"] },
{ w:"make up for", k:"ph", ja:"〜の埋め合わせをする、〜を補う", pat:"make up for A", lv:3,
  ex:[["He worked late to {make up for} the time he had lost.","彼は失った時間を取り戻すために遅くまで働いた。"]],
  syn:["compensate for"], tip:"compensate for は硬い同義表現。lost time / mistake などを目的語にとる。",
  note:"分離不可。", cat:["life"] },
{ w:"make out", k:"ph", ja:"〜を理解する、〜を見分ける・聞き取る", pat:"make out A / make A out", lv:2,
  ex:[["It was so dark that I couldn't {make out} the sign.","とても暗かったので標識が読み取れなかった。"]],
  syn:["understand","figure out"], tip:"否定文で「（見えにくい・聞こえにくいものが）わからない」と使うことが多い。",
  note:"分離可。", cat:["life"] },
{ w:"make up", k:"ph", ja:"①〜を構成する ②（話）をでっち上げる ③仲直りする", pat:"make up A / be made up of A", lv:2,
  ex:[["Women {make up} more than half of the members.","女性がメンバーの半数以上を占めている。"],["He {made up} an excuse for being late.","彼は遅刻の言い訳をでっち上げた。"]],
  syn:["form","compose","invent"], tip:"be made up of A ＝ consist of A（Aから成る）。make up with A は「Aと仲直りする」。",
  note:"分離可（構成する の意味では通常 make up A）。", cat:["soc","human"] },
{ w:"put up with", k:"ph", ja:"〜を我慢する", pat:"put up with A", lv:3,
  ex:[["I can't {put up with} the noise from upstairs any longer.","上の階からの騒音にはもう我慢できない。"]],
  syn:["stand","bear","tolerate"], tip:"stand / bear / tolerate は1語の同義語。否定文でよく使う。",
  note:"分離不可。", cat:["life","human"] },
{ w:"put out", k:"ph", ja:"（火・明かり）を消す", pat:"put out A / put A out", lv:2,
  ex:[["The firefighters quickly {put out} the fire.","消防士たちはすぐに火を消し止めた。"]],
  syn:["extinguish"], tip:"「（火を）外に出す」ではなく「消す」。",
  note:"分離可。put it out。", cat:["life"] },
{ w:"set up", k:"ph", ja:"〜を設立する、設置する、準備する", pat:"set up A / set A up", lv:3,
  ex:[["They {set up} a company to sell local vegetables online.","彼らは地元の野菜をネットで売る会社を立ち上げた。"]],
  syn:["establish","found"], tip:"establish の口語的表現。テントや機器を「組み立てる・設置する」にも使う。",
  note:"分離可。", cat:["eco"] },
{ w:"give up", k:"ph", ja:"〜をあきらめる、やめる", pat:"give up A / give up doing", lv:3,
  ex:[["He {gave up} smoking for his health.","彼は健康のためにたばこをやめた。"]],
  syn:["quit","abandon"], tip:"後ろに動詞を置くなら動名詞（give up doing）。",
  note:"分離可。give it up。", cat:["med","life"] },
{ w:"give in", k:"ph", ja:"屈する、降参する", pat:"give in (to A)", lv:2,
  ex:[["The company finally {gave in} to the workers' demands.","会社はついに労働者の要求に屈した。"]],
  syn:["yield","surrender"], tip:"give in to A（Aに屈する）。hand in / turn in（提出する）と混同しない。",
  note:"自動詞的に使う。", cat:["soc"] },
{ w:"turn down", k:"ph", ja:"①〜を断る ②（音量など）を下げる", pat:"turn down A / turn A down", lv:3,
  ex:[["She {turned down} the job offer because the salary was too low.","給料が低すぎたので彼女はその仕事の申し出を断った。"],["Could you {turn} the TV {down}?","テレビの音量を下げてもらえますか。"]],
  syn:["refuse","reject","decline"], ant:["turn up"], tip:"offer / invitation / request が目的語なら「断る」。",
  note:"分離可。turn it down。", cat:["human"] },
{ w:"turn out", k:"ph", ja:"〜だとわかる、結局〜になる", pat:"turn out (to be) A / It turns out that ...", lv:3,
  ex:[["The rumor {turned out} to be false.","そのうわさは誤りだとわかった。"]],
  syn:["prove"], tip:"prove (to be) A も同じ意味。It turned out that ...（〜ということがわかった）。",
  note:"自動詞として使い、後ろに to be＋補語や that節が続く。", cat:["life"] },
{ w:"turn in", k:"ph", ja:"〜を提出する", pat:"turn in A / turn A in", lv:2,
  ex:[["Please {turn in} your reports by Friday.","金曜日までにレポートを提出してください。"]],
  syn:["hand in","submit"], tip:"hand in / submit と同義。",
  note:"分離可。", cat:["edu"] },
{ w:"hand in", k:"ph", ja:"〜を提出する", pat:"hand in A / hand A in", lv:3,
  ex:[["You must {hand in} the application form by the end of the month.","今月末までに申込書を提出しなければならない。"]],
  syn:["turn in","submit"], tip:"学校の課題や書類の提出で使う。",
  note:"分離可。hand it in。", cat:["edu"] },
{ w:"find out", k:"ph", ja:"〜を（調べて）知る、明らかにする", pat:"find out A / find out wh-節/that節", lv:3,
  ex:[["I {found out} that the store was closed on Mondays.","その店は月曜日が定休日だとわかった。"]],
  syn:["discover","learn"], tip:"find は「（物を）見つける」、find out は「（情報・事実を）知る」。",
  note:"分離可だが、節が続くことが多い。", cat:["life"] },
{ w:"point out", k:"ph", ja:"〜を指摘する", pat:"point out A / point out that ...", lv:3,
  ex:[["The teacher {pointed out} some mistakes in my essay.","先生は私の作文のいくつかの誤りを指摘した。"]],
  syn:["indicate","mention"], tip:"長文で「専門家は〜と指摘している」（Experts point out that ...）の形で頻出。",
  note:"分離可。", cat:["edu","sci"] },
{ w:"pick up", k:"ph", ja:"①〜を拾い上げる ②（車で）迎えに行く ③（自然に）身につける", pat:"pick up A / pick A up", lv:3,
  ex:[["I'll {pick} you {up} at the station at six.","6時に駅まで車で迎えに行くよ。"],["She {picked up} Spanish while living in Mexico.","彼女はメキシコに住んでいる間にスペイン語を身につけた。"]],
  syn:["collect","learn"], tip:"「（言語・習慣を）自然に覚える」の意味は英検でよく出る。",
  note:"分離可。pick him up。", cat:["life","edu"] },
{ w:"run out of", k:"ph", ja:"〜を使い果たす、〜がなくなる", pat:"run out of A", lv:3,
  ex:[["We are {running out of} time, so let's hurry.","時間がなくなってきたので急ごう。"]],
  syn:["use up"], tip:"「A がなくなる」は A runs out とも言える（Time is running out.）。",
  note:"分離不可。主語は「人」。", cat:["life","env"] },
{ w:"keep up with", k:"ph", ja:"〜に遅れずについていく", pat:"keep up with A", lv:3,
  ex:[["It is hard to {keep up with} the latest technology.","最新の技術についていくのは難しい。"]],
  syn:["stay up to date with"], tip:"keep up with は「遅れない状態を保つ」、catch up with は「遅れている状態から追いつく」。",
  note:"分離不可。", cat:["sci","edu"] },
{ w:"catch up with", k:"ph", ja:"〜に追いつく", pat:"catch up with A", lv:3,
  ex:[["He studied hard to {catch up with} the rest of the class.","彼はクラスのほかの生徒に追いつくため一生懸命勉強した。"]],
  syn:["overtake"], tip:"keep up with（ついていく）との違いを確認。",
  note:"分離不可。", cat:["edu"] },
{ w:"get along with", k:"ph", ja:"〜とうまくやっていく、仲良くする", pat:"get along with A", lv:3,
  ex:[["She {gets along} well {with} her classmates.","彼女はクラスメートと仲良くやっている。"]],
  syn:["get on with"], tip:"well を入れて get along well with A とすることが多い。",
  note:"分離不可（well は along の後ろに入る）。", cat:["human"] },
{ w:"get over", k:"ph", ja:"〜から回復する、〜を乗り越える", pat:"get over A", lv:3,
  ex:[["It took her a long time to {get over} the shock.","彼女がそのショックから立ち直るのに長い時間がかかった。"]],
  syn:["recover from","overcome"], tip:"病気・ショック・困難のいずれにも使える。",
  note:"分離不可。get over it。", cat:["med","human"] },
{ w:"go through", k:"ph", ja:"①（困難）を経験する ②〜を詳しく調べる", pat:"go through A", lv:3,
  ex:[["Many families {went through} hard times after the war.","戦後、多くの家族がつらい時期を経験した。"]],
  syn:["experience","undergo","examine"], tip:"「〜を通り抜ける」から「（つらいこと）を経験する」。",
  note:"分離不可。", cat:["life","human"] },
{ w:"fill out", k:"ph", ja:"（書類）に記入する", pat:"fill out A / fill A out", lv:2,
  ex:[["Please {fill out} this form and give it to the receptionist.","この用紙に記入して受付係に渡してください。"]],

<script>
/* 共通ユーティリティ */
(function (g) {
  "use strict";
  var U = {};

  U.esc = function (s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  };

  /* 例文中の {対象語} を強調表示 */
  U.markEx = function (s) {
    return U.esc(s).replace(/\{([^}]*)\}/g, '<b class="hl">$1</b>');
  };
  /* 例文中の {対象語} を空欄にする */
  U.blankEx = function (s) {
    return U.esc(s).replace(/\{([^}]*)\}/g, '<span class="blank">　　　</span>');
  };
  U.plainEx = function (s) { return String(s).replace(/[{}]/g, ""); };
  U.hasTarget = function (s) { return /\{[^}]+\}/.test(s); };

  U.shuffle = function (a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  };
  U.pick = function (a) { return a[Math.floor(Math.random() * a.length)]; };

  U.today = function (d) {
    d = d || new Date();
    var m = d.getMonth() + 1, day = d.getDate();
    return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (day < 10 ? "0" : "") + day;
  };
  U.fmtDate = function (ts) {
    if (!ts) return "—";
    var d = new Date(ts);
    return (d.getMonth() + 1) + "/" + d.getDate();
  };
  U.pct = function (a, b) { return b ? Math.round((a / b) * 100) : 0; };

  /* 解答の比較用：小文字化・記号除去・A/B/doing などのプレースホルダー除去 */
  var PH = { a: 1, b: 1, "one's": 1, oneself: 1, doing: 1, someone: 1, something: 1, sb: 1, sth: 1, "~": 1, "〜": 1 };
  U.normAnswer = function (s) {
    return String(s || "").toLowerCase()
      .replace(/[’`]/g, "'")
      .replace(/[^a-z' ~〜-]/g, " ")
      .split(/\s+/).filter(function (t) { return t && !PH[t]; }).join(" ");
  };

  U.qs = function (sel, root) { return (root || document).querySelector(sel); };
  U.qsa = function (sel, root) { return Array.prototype.slice.call((root || document).querySelectorAll(sel)); };

  g.U = U;
})(window);

</script>
<script>
/*
 * 学習記録の保存（localStorage）と復習スケジュール（間隔反復）
 *
 * 1語ごとの記録 p:
 *   n: 学習回数  c: 正解数  x: 不正解数  s: 連続正解数
 *   b: 習熟ボックス(0-5)  due: 次回復習の目安時刻  last: 最終学習時刻
 *   weak: 苦手フラグ（1度でも間違えると true、3回連続正解で卒業）
 */
(function (g) {
  "use strict";
  var KEY = "eiken2.progress.v1";
  var SKEY = "eiken2.settings.v1";
  var DAY = 86400000;
  /* ボックスごとの次回復習までの間隔 */
  var INTERVAL = [10 * 60000, 1 * DAY, 3 * DAY, 7 * DAY, 14 * DAY, 30 * DAY];
  var WEAK_CLEAR = 3; // 苦手卒業に必要な連続正解数
  var MASTER_BOX = 3; // このボックス以上を「定着」とみなす

  var state = load(KEY, { items: {}, daily: {}, v: 1 });
  var settings = load(SKEY, { autoSpeak: false, rate: 0.9, listView: "both" });

  function load(k, def) {
    try {
      var s = localStorage.getItem(k);
      if (s) {
        var o = JSON.parse(s);
        for (var key in def) if (!(key in o)) o[key] = def[key];
        return o;
      }
    } catch (e) { /* 読めない場合は初期値 */ }
    return JSON.parse(JSON.stringify(def));
  }
  var saveTimer = null;
  function save() {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 200);
  }
  function flush() {
    clearTimeout(saveTimer);
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { console.warn("保存に失敗", e); }
  }
  window.addEventListener("pagehide", flush);
  window.addEventListener("beforeunload", flush);

  var S = {
    MASTER_BOX: MASTER_BOX,
    WEAK_CLEAR: WEAK_CLEAR,
    get: function (id) { return state.items[id] || null; },
    all: function () { return state.items; },
    daily: function () { return state.daily; },

    /* 解答結果を記録する */
    record: function (id, ok) {
      var now = Date.now();
      var p = state.items[id] || (state.items[id] = { n: 0, c: 0, x: 0, s: 0, b: 0, due: 0, last: 0, weak: false });
      p.n++; p.last = now;
      if (ok) {
        p.c++; p.s++;
        p.b = Math.min(p.b + 1, INTERVAL.length - 1);
        if (p.weak && p.s >= WEAK_CLEAR) p.weak = false;
      } else {
        p.x++; p.s = 0;
        p.b = 0;
        p.weak = true;
      }
      p.due = now + INTERVAL[p.b];
      var d = U.today();
      var day = state.daily[d] || (state.daily[d] = { n: 0, c: 0 });
      day.n++; if (ok) day.c++;
      save();
      return p;
    },

    setWeak: function (id, flag) {
      var p = state.items[id] || (state.items[id] = { n: 0, c: 0, x: 0, s: 0, b: 0, due: 0, last: 0, weak: false });
      p.weak = !!flag;
      if (flag) p.s = 0;
      save();
    },

    status: function (id) {
      var p = state.items[id];
      if (!p || !p.n) return "new";
      if (p.weak) return "weak";
      if (p.b >= MASTER_BOX) return "master";
      return "learning";
    },

    /*
     * 出題の優先度（重み）。苦手・復習期限切れは高く、
     * 何度も正解して定着した語は低くする。
     */
    weight: function (id) {
      var p = state.items[id];
      if (!p || !p.n) return 1.2;               // 未学習
      var now = Date.now();
      var w;
      if (p.weak) w = 6 + Math.min(p.x, 5);      // 苦手
      else if (p.due <= now) w = 3 + Math.min((now - p.due) / DAY, 7) * 0.5; // 復習期限切れ
      else w = 0.6 / (p.b + 1);                 // まだ期限前
      return w;
    },
    isDue: function (id) {
      var p = state.items[id];
      return !!p && p.n > 0 && (p.weak || p.due <= Date.now());
    },

    streakDays: function () {
      var n = 0, d = new Date();
      if (!state.daily[U.today(d)]) d.setDate(d.getDate() - 1); // 今日まだなら昨日から数える
      while (state.daily[U.today(d)]) { n++; d.setDate(d.getDate() - 1); }
      return n;
    },

    settings: settings,
    saveSettings: function () {
      try { localStorage.setItem(SKEY, JSON.stringify(settings)); } catch (e) { /* noop */ }
    },

    exportJSON: function () {
      flush();
      return JSON.stringify({ app: "eiken2-vocab", exported: new Date().toISOString(), progress: state, settings: settings });
    },
    importJSON: function (text) {
      var o = JSON.parse(text);
      if (!o || !o.progress || typeof o.progress.items !== "object") throw new Error("形式が正しくありません");
      state = o.progress;
      if (!state.daily) state.daily = {};
      flush();
    },
    reset: function () {
      state = { items: {}, daily: {}, v: 1 };
      flush();
    }
  };

  g.Store = S;
})(window);

</script>
<script>
/* 単語データの索引・カテゴリ・検索 */
(function (g) {
  "use strict";
  var items = (g.EIKEN && g.EIKEN.items) || [];
  var byId = {};
  items.forEach(function (e, i) {
    e._i = i;
    if (typeof e.pos === "string") e.pos = [e.pos];
    e.pos = e.pos || [];
    e.cat = e.cat || [];
    e.ex = e.ex || [];
    if (byId[e.id]) console.warn("ID重複:", e.id);
    byId[e.id] = e;
    e._search = (e.w + " " + e.ja + " " + (e.syn || []).join(" ") + " " + (e.pat || "")).toLowerCase();
  });

  var POS_LABEL = { v: "動", n: "名", adj: "形", adv: "副", prep: "前", conj: "接" };
  var KIND_LABEL = { w: "単語", ph: "句動詞", id: "熟語" };

  function hasPos(p) { return function (e) { return e.k === "w" && e.pos.indexOf(p) >= 0; }; }
  function hasCat(c) { return function (e) { return e.cat.indexOf(c) >= 0; }; }

  var CATS = [
    { id: "all", label: "全単語", group: "", test: function () { return true; } },
    { id: "v", label: "動詞", group: "品詞", test: hasPos("v") },
    { id: "n", label: "名詞", group: "品詞", test: hasPos("n") },
    { id: "adj", label: "形容詞", group: "品詞", test: hasPos("adj") },
    { id: "adv", label: "副詞", group: "品詞", test: hasPos("adv") },
    { id: "phr_all", label: "熟語すべて", group: "熟語", test: function (e) { return e.k === "id" || e.k === "ph"; } },
    { id: "idiom", label: "熟語・表現", group: "熟語", test: function (e) { return e.k === "id"; } },
    { id: "phrasal", label: "句動詞", group: "熟語", test: function (e) { return e.k === "ph"; } },
    { id: "env", label: "環境", group: "分野", test: hasCat("env") },
    { id: "sci", label: "科学・テクノロジー", group: "分野", test: hasCat("sci") },
    { id: "edu", label: "教育", group: "分野", test: hasCat("edu") },
    { id: "soc", label: "社会・政治", group: "分野", test: hasCat("soc") },
    { id: "eco", label: "経済", group: "分野", test: hasCat("eco") },
    { id: "med", label: "医療・健康", group: "分野", test: hasCat("med") },
    { id: "life", label: "生活", group: "分野", test: hasCat("life") },
    { id: "human", label: "人間関係", group: "分野", test: hasCat("human") }
  ];
  var catById = {};
  CATS.forEach(function (c) { catById[c.id] = c; });

  /* 種類ごとに事前計算（数千語でも高速に絞り込めるように） */
  var catIndex = {};
  CATS.forEach(function (c) { catIndex[c.id] = items.filter(c.test); });

  var D = {
    items: items,
    get: function (id) { return byId[id]; },
    CATS: CATS,
    cat: function (id) { return catById[id] || catById.all; },
    inCat: function (id) { return catIndex[id] || items; },
    isIdiom: function (e) { return e.k === "ph" || e.k === "id"; },
    posLabel: function (e) {
      if (e.k !== "w") return KIND_LABEL[e.k];
      return e.pos.map(function (p) { return POS_LABEL[p] || p; }).join("・");
    },
    kindLabel: function (e) { return KIND_LABEL[e.k] || ""; },
    catLabels: function (e) {
      return e.cat.map(function (c) { return catById[c] ? catById[c].label : c; });
    },
    /*
     * 絞り込み
     * opt: {cat, q, lv, status}  status = all|new|weak|learning|master|due
     */
    filter: function (opt) {
      var list = D.inCat(opt.cat || "all");
      var q = (opt.q || "").trim().toLowerCase();
      var lv = +opt.lv || 0;
      var st = opt.status || "all";
      if (!q && !lv && st === "all") return list;
      var out = list.filter(function (e) {
        if (lv && e.lv !== lv) return false;
        if (q && e._search.indexOf(q) < 0) return false;
        if (st !== "all") {
          if (st === "due") { if (!Store.isDue(e.id)) return false; }
          else if (Store.status(e.id) !== st) return false;
        }
        return true;
      });
      if (q) {
        // 見出し語が検索語で始まるものを先頭に
        var head = [], rest = [];
        out.forEach(function (e) { (e.w.toLowerCase().indexOf(q) === 0 ? head : rest).push(e); });
        out = head.concat(rest);
      }
      return out;
    },
    /* 意味の主要部分（選択肢の重複判定用） */
    glossTokens: function (e) {
      return String(e.ja).split(/[、,，;；／\/①-⑨()（）\s]+/)
        .map(function (t) { return t.replace(/^[〜~]?(を|に|が|は|と|で|の)?/, "").replace(/[〜~]/g, "").trim(); })
        .filter(function (t) { return t.length >= 2; });
    }
  };

  g.Data = D;
})(window);

</script>

      synth.cancel();
      var t = U.plainEx(text);
      if (head) t = t.replace(/(^|\s)(A|B)(?=\s|$)/g, " ").replace(/[〜~]/g, "");
      var u = new SpeechSynthesisUtterance(t);
      u.lang = "en-US";
      if (voice) u.voice = voice;
      u.rate = Store.settings.rate || 0.9;
      synth.speak(u);
    }
  };
})(window);

</script>
<script>
/* 出題ロジック：セッション作成・選択肢生成 */
(function (g) {
  "use strict";

  var PARTICLES = ["about", "across", "after", "against", "along", "around", "as", "at", "away", "back",
    "by", "down", "for", "from", "in", "into", "of", "off", "on", "out", "over", "through", "to", "up", "with"];
  var COMMON = ["in", "on", "at", "to", "for", "with", "from", "of", "by", "up", "out", "off", "into", "about", "down", "over", "away"];
  var isParticle = {};
  PARTICLES.forEach(function (p) { isParticle[p] = 1; });

  var MODES = {
    e2j: { label: "英語 → 日本語", desc: "単語を見て意味を思い出す（自己採点）" },
    j2e: { label: "日本語 → 英語", desc: "意味を見て英語を入力する" },
    mc: { label: "4択テスト", desc: "似た意味の選択肢から正しいものを選ぶ" },
    fill: { label: "例文穴埋め", desc: "文脈から空欄に入る語を選ぶ" },
    prep: { label: "前置詞・副詞を選ぶ", desc: "熟語の前置詞・副詞を正確に覚える" },
    mix: { label: "おすすめミックス", desc: "4択・穴埋め・前置詞を混ぜて出題" }
  };

  function exWithTarget(e) {
    return e.ex.filter(function (x) { return U.hasTarget(x[0]); });
  }
  /* 前置詞・副詞の空欄候補の位置 */
  function particleSlots(e) {
    if (e.k === "w") return [];
    var t = e.w.split(/\s+/), slots = [];
    for (var i = 0; i < t.length; i++) {
      if (!isParticle[t[i]]) continue;
      if (i === 0 && e.k === "ph") continue;
      slots.push(i);
    }
    return slots;
  }

  /* 紛らわしい選択肢を選ぶ（同じ品詞・同じ分野を優先、意味が重なるものは除外） */
  function distractors(e, n, mode) {
    var idiom = Data.isIdiom(e);
    var pool = Data.items.filter(function (o) {
      if (o === e || o.w === e.w) return false;
      if (idiom) return Data.isIdiom(o);
      return o.k === "w" && o.pos.some(function (p) { return e.pos.indexOf(p) >= 0; });
    });
    if (pool.length < n) pool = Data.items.filter(function (o) { return o !== e; });

    var gt = Data.glossTokens(e);
    var syn = {}; (e.syn || []).forEach(function (s) { syn[s.toLowerCase()] = 1; });
    var scored = [];
    pool.forEach(function (o) {
      var og = Data.glossTokens(o);
      var overlap = og.some(function (t) { return gt.some(function (u) { return t === u || (t.length >= 3 && u.indexOf(t) >= 0) || (u.length >= 3 && t.indexOf(u) >= 0); }); });
      if (overlap) return;
      if (mode === "fill" && (syn[o.w.toLowerCase()] || (o.syn || []).indexOf(e.w) >= 0)) return; // 文脈で正解になり得る語は除外
      var s = Math.random() * 2.5;
      o.cat.forEach(function (c) { if (e.cat.indexOf(c) >= 0) s += 1.5; });
      if (o.pos[0] === e.pos[0]) s += 1;
      if (o.lv === e.lv) s += 0.5;
      if (mode !== "fill" && syn[o.w.toLowerCase()]) s += 2; // 意味が近い語は良い引っかけ
      scored.push([s, o]);
    });
    scored.sort(function (a, b) { return b[0] - a[0]; });
    var out = [], seen = {};
    for (var i = 0; i < scored.length && out.length < n; i++) {
      var o = scored[i][1];
      if (seen[o.ja] || seen[o.w]) continue;
      seen[o.ja] = seen[o.w] = 1;
      out.push(o);
    }
    return out;
  }

  function makeQuestion(e, type, dir) {
    var q = { type: type, id: e.id, dir: dir || "e2j" };
    if (type === "mc") {
      q.options = U.shuffle([e].concat(distractors(e, 3, "mc"))).map(function (o) { return o.id; });
    } else if (type === "fill") {
      var exs = exWithTarget(e);
      q.ex = U.pick(exs);
      q.options = U.shuffle([e].concat(distractors(e, 3, "fill"))).map(function (o) { return o.id; });
    } else if (type === "prep") {
      var slots = particleSlots(e);
      var si = U.pick(slots);
      var tokens = e.w.split(/\s+/);
      var ans = tokens[si];
      var others = U.shuffle(COMMON.filter(function (p) { return p !== ans && tokens.indexOf(p) < 0; })).slice(0, 3);
      q.slot = si;
      q.answer = ans;
      q.options = U.shuffle([ans].concat(others));
      q.ex = exWithTarget(e)[0] || e.ex[0];
    }
    return q;
  }

  function canDo(e, type) {
    if (type === "fill") return exWithTarget(e).length > 0;
    if (type === "prep") return particleSlots(e).length > 0;
    return true;
  }

  /* 重み付きランダム抽出（重みが大きい語ほど選ばれやすい） */
  function weightedPick(list, n) {
    return list.map(function (e) {
      var w = Math.max(Store.weight(e.id), 0.01);
      return [Math.pow(Math.random(), 1 / w), e];
    }).sort(function (a, b) { return b[0] - a[0]; }).slice(0, n).map(function (x) { return x[1]; });
  }

  /*
   * opt: {mode, cat, status, lv, count, order(smart|random|list), dir(e2j|j2e), ids}
   */
  function buildSession(opt) {
    var mode = opt.mode || "mc";
    var pool = opt.ids ? opt.ids.map(Data.get).filter(Boolean) : Data.filter(opt);
    if (mode === "fill" || mode === "prep") pool = pool.filter(function (e) { return canDo(e, mode); });
    var count = Math.min(opt.count || 20, pool.length);
    var chosen;
    if (opt.order === "list") chosen = pool.slice(0, count);
    else if (opt.order === "random") chosen = U.shuffle(pool.slice()).slice(0, count);
    else chosen = weightedPick(pool, count);

    var qs = chosen.map(function (e) {
      var type = mode;
      if (mode === "mix") {
        var r = Math.random();
        if (canDo(e, "prep") && r < 0.3) type = "prep";
        else if (canDo(e, "fill") && r < 0.65) type = "fill";
        else type = "mc";
      }
      return { type: type, id: e.id };
    });
    return { mode: mode, dir: opt.dir || "e2j", opt: opt, qs: qs, i: 0, results: [], started: Date.now() };
  }

  g.Quiz = {
    MODES: MODES,
    buildSession: buildSession,
    makeQuestion: makeQuestion,
    canDo: canDo,
    particleSlots: particleSlots,
    poolSize: function (opt) {
      var pool = Data.filter(opt);
      if (opt.mode === "fill" || opt.mode === "prep") pool = pool.filter(function (e) { return canDo(e, opt.mode); });
      return pool.length;
    }
  };
})(window);

</script>
<script>
